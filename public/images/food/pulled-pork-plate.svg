<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a2c1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c1810;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="meat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Plate -->
  <ellipse cx="200" cy="240" rx="180" ry="40" fill="#4a4a4a"/>
  <ellipse cx="200" cy="235" rx="180" ry="40" fill="#696969"/>
  
  <!-- Pulled pork main portion -->
  <ellipse cx="200" cy="180" rx="60" ry="30" fill="url(#meat)"/>
  <ellipse cx="195" cy="175" rx="55" ry="25" fill="#8b4513"/>
  <ellipse cx="205" cy="185" rx="50" ry="20" fill="#a0522d"/>
  
  <!-- Pulled pork texture -->
  <ellipse cx="180" cy="170" rx="15" ry="8" fill="#654321"/>
  <ellipse cx="220" cy="175" rx="18" ry="10" fill="#654321"/>
  <ellipse cx="190" cy="190" rx="12" ry="6" fill="#8b4513"/>
  <ellipse cx="210" cy="195" rx="14" ry="7" fill="#8b4513"/>
  <ellipse cx="185" cy="185" rx="10" ry="5" fill="#a0522d"/>
  <ellipse cx="215" cy="180" rx="12" ry="6" fill="#a0522d"/>
  
  <!-- Coleslaw side -->
  <circle cx="120" cy="160" r="25" fill="#f5f5dc"/>
  <circle cx="115" cy="155" r="20" fill="#fff8dc"/>
  <!-- Shredded texture -->
  <line x1="105" y1="150" x2="125" y2="160" stroke="#daa520" stroke-width="1"/>
  <line x1="110" y1="165" x2="130" y2="155" stroke="#daa520" stroke-width="1"/>
  <line x1="100" y1="160" x2="120" y2="170" stroke="#ffd700" stroke-width="1"/>
  
  <!-- Baked beans side -->
  <circle cx="280" cy="160" r="25" fill="#8b4513"/>
  <circle cx="275" cy="155" r="20" fill="#a0522d"/>
  <!-- Bean texture -->
  <ellipse cx="270" cy="150" rx="3" ry="2" fill="#654321"/>
  <ellipse cx="280" cy="155" rx="3" ry="2" fill="#654321"/>
  <ellipse cx="275" cy="165" rx="3" ry="2" fill="#654321"/>
  <ellipse cx="285" cy="160" rx="3" ry="2" fill="#654321"/>
  <ellipse cx="265" cy="160" rx="3" ry="2" fill="#654321"/>
  
  <!-- Cornbread -->
  <rect x="300" y="200" width="40" height="25" rx="3" fill="#deb887"/>
  <rect x="302" y="198" width="36" height="22" rx="2" fill="#f4a460"/>
  <!-- Cornbread texture -->
  <circle cx="315" cy="205" r="1" fill="#daa520"/>
  <circle cx="320" cy="210" r="1" fill="#daa520"/>
  <circle cx="310" cy="215" r="1" fill="#daa520"/>
  <circle cx="325" cy="208" r="1" fill="#daa520"/>
  
  <!-- BBQ sauce -->
  <ellipse cx="150" cy="200" rx="15" ry="8" fill="#8b0000"/>
  <ellipse cx="150" cy="198" rx="12" ry="6" fill="#dc143c"/>
  
  <!-- Smoke effect -->
  <g opacity="0.5">
    <circle cx="170" cy="120" r="8" fill="#f5f5f5" opacity="0.4"/>
    <circle cx="175" cy="110" r="10" fill="#f5f5f5" opacity="0.3"/>
    <circle cx="180" cy="95" r="12" fill="#f5f5f5" opacity="0.2"/>
    <circle cx="220" cy="125" r="9" fill="#f5f5f5" opacity="0.4"/>
    <circle cx="225" cy="115" r="11" fill="#f5f5f5" opacity="0.3"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffc19e" text-anchor="middle">Pulled Pork Plate</text>
  <text x="200" y="65" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" opacity="0.8">Comfort Food at Its Best</text>
</svg> 