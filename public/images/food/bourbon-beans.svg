<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a2c1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c1810;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0522d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Cast iron pot -->
  <ellipse cx="200" cy="220" rx="100" ry="60" fill="#2f2f2f"/>
  <ellipse cx="200" cy="215" rx="95" ry="55" fill="#404040"/>
  <ellipse cx="200" cy="210" rx="90" ry="50" fill="#4a4a4a"/>
  
  <!-- Pot handles -->
  <ellipse cx="110" cy="200" rx="8" ry="15" fill="#2f2f2f"/>
  <ellipse cx="290" cy="200" rx="8" ry="15" fill="#2f2f2f"/>
  
  <!-- Bean sauce base -->
  <ellipse cx="200" cy="200" rx="80" ry="40" fill="url(#beans)"/>
  <ellipse cx="200" cy="195" rx="75" ry="35" fill="#654321"/>
  
  <!-- Individual beans -->
  <ellipse cx="170" cy="185" rx="4" ry="6" fill="#8b4513"/>
  <ellipse cx="185" cy="190" rx="4" ry="6" fill="#a0522d"/>
  <ellipse cx="200" cy="180" rx="4" ry="6" fill="#8b4513"/>
  <ellipse cx="215" cy="195" rx="4" ry="6" fill="#a0522d"/>
  <ellipse cx="230" cy="185" rx="4" ry="6" fill="#8b4513"/>
  <ellipse cx="160" cy="200" rx="4" ry="6" fill="#a0522d"/>
  <ellipse cx="240" cy="200" rx="4" ry="6" fill="#8b4513"/>
  <ellipse cx="180" cy="205" rx="4" ry="6" fill="#a0522d"/>
  <ellipse cx="220" cy="205" rx="4" ry="6" fill="#8b4513"/>
  <ellipse cx="190" cy="215" rx="4" ry="6" fill="#a0522d"/>
  <ellipse cx="210" cy="215" rx="4" ry="6" fill="#8b4513"/>
  <ellipse cx="175" cy="210" rx="4" ry="6" fill="#a0522d"/>
  <ellipse cx="225" cy="190" rx="4" ry="6" fill="#8b4513"/>
  <ellipse cx="165" cy="175" rx="4" ry="6" fill="#a0522d"/>
  <ellipse cx="235" cy="175" rx="4" ry="6" fill="#8b4513"/>
  
  <!-- Burnt ends pieces -->
  <rect x="175" y="175" width="8" height="6" rx="2" fill="#654321"/>
  <rect x="195" y="185" width="6" height="8" rx="2" fill="#2f2f2f"/>
  <rect x="220" y="180" width="7" height="7" rx="2" fill="#654321"/>
  <rect x="205" y="200" width="8" height="6" rx="2" fill="#2f2f2f"/>
  <rect x="185" y="200" width="6" height="7" rx="2" fill="#654321"/>
  
  <!-- Sauce glaze on top -->
  <ellipse cx="200" cy="175" rx="40" ry="15" fill="#8b0000" opacity="0.7"/>
  <ellipse cx="195" cy="170" rx="35" ry="12" fill="#dc143c" opacity="0.6"/>
  
  <!-- Bourbon bottle (small) -->
  <rect x="320" y="140" width="12" height="35" rx="2" fill="#4a2c1a"/>
  <rect x="322" y="138" width="8" height="4" rx="1" fill="#8b4513"/>
  <rect x="324" y="145" width="4" height="25" fill="#daa520"/>
  
  <!-- Steam/smoke effect -->
  <g opacity="0.6">
    <circle cx="160" cy="120" r="6" fill="#f5f5f5" opacity="0.4"/>
    <circle cx="165" cy="110" r="8" fill="#f5f5f5" opacity="0.3"/>
    <circle cx="170" cy="95" r="10" fill="#f5f5f5" opacity="0.2"/>
    <circle cx="240" cy="125" r="7" fill="#f5f5f5" opacity="0.4"/>
    <circle cx="245" cy="115" r="9" fill="#f5f5f5" opacity="0.3"/>
    <circle cx="250" cy="100" r="11" fill="#f5f5f5" opacity="0.2"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffc19e" text-anchor="middle">Bourbon Baked Beans</text>
  <text x="200" y="65" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" opacity="0.8">A BBQ Classic with a Twist</text>
</svg> 