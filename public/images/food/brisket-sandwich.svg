<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a2c1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c1810;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#deb887;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d2b48c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="meat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Plate -->
  <ellipse cx="200" cy="250" rx="150" ry="30" fill="#4a4a4a"/>
  <ellipse cx="200" cy="248" rx="150" ry="30" fill="#696969"/>
  
  <!-- Bottom bun -->
  <ellipse cx="200" cy="200" rx="80" ry="20" fill="url(#bun)"/>
  <ellipse cx="200" cy="195" rx="75" ry="18" fill="#f4a460"/>
  
  <!-- Brisket meat -->
  <ellipse cx="200" cy="175" rx="70" ry="15" fill="url(#meat)"/>
  <ellipse cx="195" cy="172" rx="65" ry="12" fill="#8b4513"/>
  <ellipse cx="205" cy="170" rx="60" ry="10" fill="#a0522d"/>
  <ellipse cx="190" cy="168" rx="55" ry="8" fill="#654321"/>
  
  <!-- Pickles -->
  <ellipse cx="160" cy="165" rx="8" ry="4" fill="#228b22"/>
  <ellipse cx="240" cy="165" rx="8" ry="4" fill="#228b22"/>
  <ellipse cx="180" cy="163" rx="6" ry="3" fill="#32cd32"/>
  <ellipse cx="220" cy="163" rx="6" ry="3" fill="#32cd32"/>
  
  <!-- Onions -->
  <ellipse cx="170" cy="160" rx="6" ry="3" fill="#f5f5dc"/>
  <ellipse cx="230" cy="160" rx="6" ry="3" fill="#f5f5dc"/>
  <ellipse cx="200" cy="158" rx="8" ry="4" fill="#fff8dc"/>
  
  <!-- Top bun -->
  <ellipse cx="200" cy="150" rx="80" ry="25" fill="url(#bun)"/>
  <ellipse cx="200" cy="145" rx="75" ry="22" fill="#f4a460"/>
  
  <!-- Sesame seeds -->
  <circle cx="170" cy="140" r="2" fill="#fff8dc"/>
  <circle cx="185" cy="138" r="2" fill="#fff8dc"/>
  <circle cx="200" cy="137" r="2" fill="#fff8dc"/>
  <circle cx="215" cy="138" r="2" fill="#fff8dc"/>
  <circle cx="230" cy="140" r="2" fill="#fff8dc"/>
  <circle cx="175" cy="145" r="1.5" fill="#fff8dc"/>
  <circle cx="225" cy="145" r="1.5" fill="#fff8dc"/>
  
  <!-- BBQ sauce bottle -->
  <rect x="320" y="120" width="15" height="40" rx="2" fill="#8b0000"/>
  <rect x="322" y="118" width="11" height="5" rx="1" fill="#4a4a4a"/>
  <rect x="324" y="125" width="7" height="30" fill="#dc143c"/>
  
  <!-- Smoke effect -->
  <g opacity="0.6">
    <circle cx="180" cy="110" r="6" fill="#f5f5f5" opacity="0.4"/>
    <circle cx="185" cy="100" r="8" fill="#f5f5f5" opacity="0.3"/>
    <circle cx="190" cy="85" r="10" fill="#f5f5f5" opacity="0.2"/>
    <circle cx="220" cy="115" r="7" fill="#f5f5f5" opacity="0.4"/>
    <circle cx="225" cy="105" r="9" fill="#f5f5f5" opacity="0.3"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffc19e" text-anchor="middle">Brisket Sandwich</text>
  <text x="200" y="65" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" opacity="0.8">The King of Sandwiches</text>
</svg> 