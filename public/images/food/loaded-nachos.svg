<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a2c1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c1810;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cheese" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Plate -->
  <ellipse cx="200" cy="250" rx="180" ry="40" fill="#4a4a4a"/>
  <ellipse cx="200" cy="245" rx="180" ry="40" fill="#696969"/>
  
  <!-- Tortilla chips base -->
  <polygon points="120,200 160,180 140,220" fill="#deb887"/>
  <polygon points="160,210 200,190 180,230" fill="#deb887"/>
  <polygon points="200,200 240,180 220,220" fill="#deb887"/>
  <polygon points="240,210 280,190 260,230" fill="#deb887"/>
  <polygon points="100,220 140,200 120,240" fill="#d2b48c"/>
  <polygon points="140,230 180,210 160,250" fill="#d2b48c"/>
  <polygon points="180,220 220,200 200,240" fill="#d2b48c"/>
  <polygon points="220,230 260,210 240,250" fill="#d2b48c"/>
  <polygon points="260,220 300,200 280,240" fill="#d2b48c"/>
  
  <!-- Cheese sauce -->
  <ellipse cx="180" cy="190" rx="25" ry="15" fill="url(#cheese)" opacity="0.8"/>
  <ellipse cx="220" cy="200" rx="30" ry="18" fill="url(#cheese)" opacity="0.8"/>
  <ellipse cx="200" cy="220" rx="35" ry="20" fill="url(#cheese)" opacity="0.8"/>
  <ellipse cx="160" cy="215" rx="20" ry="12" fill="url(#cheese)" opacity="0.8"/>
  <ellipse cx="240" cy="210" rx="25" ry="15" fill="url(#cheese)" opacity="0.8"/>
  
  <!-- Pulled pork pieces -->
  <ellipse cx="170" cy="180" rx="8" ry="5" fill="#8b4513"/>
  <ellipse cx="210" cy="185" rx="10" ry="6" fill="#8b4513"/>
  <ellipse cx="230" cy="195" rx="7" ry="4" fill="#8b4513"/>
  <ellipse cx="190" cy="205" rx="9" ry="5" fill="#8b4513"/>
  <ellipse cx="250" cy="200" rx="8" ry="4" fill="#8b4513"/>
  
  <!-- Jalapeños -->
  <ellipse cx="185" cy="175" rx="4" ry="2" fill="#228b22"/>
  <ellipse cx="225" cy="190" rx="4" ry="2" fill="#228b22"/>
  <ellipse cx="195" cy="210" rx="4" ry="2" fill="#228b22"/>
  <ellipse cx="245" cy="205" rx="4" ry="2" fill="#228b22"/>
  
  <!-- Tomatoes -->
  <circle cx="175" cy="190" r="3" fill="#ff6347"/>
  <circle cx="215" cy="195" r="3" fill="#ff6347"/>
  <circle cx="205" cy="215" r="3" fill="#ff6347"/>
  <circle cx="235" cy="195" r="3" fill="#ff6347"/>
  
  <!-- Sour cream dollops -->
  <ellipse cx="160" cy="185" rx="8" ry="6" fill="#f5f5dc"/>
  <ellipse cx="240" cy="190" rx="8" ry="6" fill="#f5f5dc"/>
  <ellipse cx="210" cy="210" rx="8" ry="6" fill="#f5f5dc"/>
  
  <!-- Guacamole -->
  <ellipse cx="120" cy="140" rx="20" ry="12" fill="#6b8e23"/>
  <ellipse cx="280" cy="140" rx="20" ry="12" fill="#6b8e23"/>
  
  <!-- Title -->
  <text x="200" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffc19e" text-anchor="middle">Loaded BBQ Nachos</text>
  <text x="200" y="65" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" opacity="0.8">Comfort Food Perfection</text>
</svg> 