<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a2c1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c1810;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cheese" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Cast iron skillet -->
  <ellipse cx="200" cy="210" rx="120" ry="70" fill="#2f2f2f"/>
  <ellipse cx="200" cy="205" rx="115" ry="65" fill="#404040"/>
  <ellipse cx="200" cy="200" rx="110" ry="60" fill="#4a4a4a"/>
  
  <!-- Handle -->
  <rect x="320" y="195" width="40" height="10" rx="5" fill="#2f2f2f"/>
  
  <!-- Cheese sauce base -->
  <ellipse cx="200" cy="190" rx="95" ry="50" fill="url(#cheese)"/>
  <ellipse cx="200" cy="185" rx="90" ry="45" fill="#ffa500"/>
  
  <!-- Macaroni noodles -->
  <ellipse cx="170" cy="175" rx="8" ry="4" fill="#f4a460" transform="rotate(15 170 175)"/>
  <ellipse cx="185" cy="180" rx="8" ry="4" fill="#f4a460" transform="rotate(-20 185 180)"/>
  <ellipse cx="200" cy="170" rx="8" ry="4" fill="#f4a460" transform="rotate(45 200 170)"/>
  <ellipse cx="215" cy="185" rx="8" ry="4" fill="#f4a460" transform="rotate(-10 215 185)"/>
  <ellipse cx="230" cy="175" rx="8" ry="4" fill="#f4a460" transform="rotate(30 230 175)"/>
  <ellipse cx="160" cy="190" rx="8" ry="4" fill="#f4a460" transform="rotate(-35 160 190)"/>
  <ellipse cx="240" cy="190" rx="8" ry="4" fill="#f4a460" transform="rotate(20 240 190)"/>
  <ellipse cx="180" cy="195" rx="8" ry="4" fill="#f4a460" transform="rotate(10 180 195)"/>
  <ellipse cx="220" cy="195" rx="8" ry="4" fill="#f4a460" transform="rotate(-25 220 195)"/>
  <ellipse cx="190" cy="210" rx="8" ry="4" fill="#f4a460" transform="rotate(40 190 210)"/>
  <ellipse cx="210" cy="210" rx="8" ry="4" fill="#f4a460" transform="rotate(-15 210 210)"/>
  
  <!-- Bacon bits -->
  <rect x="165" y="165" width="6" height="4" rx="1" fill="#8b4513"/>
  <rect x="180" y="170" width="5" height="3" rx="1" fill="#a0522d"/>
  <rect x="220" y="175" width="6" height="4" rx="1" fill="#8b4513"/>
  <rect x="235" y="180" width="5" height="3" rx="1" fill="#a0522d"/>
  <rect x="175" y="190" width="6" height="4" rx="1" fill="#8b4513"/>
  <rect x="225" y="190" width="5" height="3" rx="1" fill="#a0522d"/>
  <rect x="195" y="200" width="6" height="4" rx="1" fill="#8b4513"/>
  
  <!-- Breadcrumb topping -->
  <circle cx="175" cy="160" r="2" fill="#deb887"/>
  <circle cx="190" cy="155" r="2" fill="#deb887"/>
  <circle cx="205" cy="160" r="2" fill="#deb887"/>
  <circle cx="220" cy="165" r="2" fill="#deb887"/>
  <circle cx="185" cy="165" r="1.5" fill="#f4a460"/>
  <circle cx="210" cy="155" r="1.5" fill="#f4a460"/>
  <circle cx="195" cy="150" r="1.5" fill="#f4a460"/>
  
  <!-- Extra cheese on top -->
  <ellipse cx="200" cy="155" rx="30" ry="10" fill="url(#cheese)" opacity="0.7"/>
  <ellipse cx="190" cy="160" rx="20" ry="6" fill="#ffd700" opacity="0.6"/>
  <ellipse cx="210" cy="150" rx="25" ry="8" fill="#daa520" opacity="0.6"/>
  
  <!-- Smoke effect -->
  <g opacity="0.6">
    <circle cx="150" cy="110" r="8" fill="#f5f5f5" opacity="0.4"/>
    <circle cx="155" cy="100" r="10" fill="#f5f5f5" opacity="0.3"/>
    <circle cx="160" cy="85" r="12" fill="#f5f5f5" opacity="0.2"/>
    <circle cx="250" cy="115" r="9" fill="#f5f5f5" opacity="0.4"/>
    <circle cx="255" cy="105" r="11" fill="#f5f5f5" opacity="0.3"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffc19e" text-anchor="middle">Smoked Mac &amp; Cheese</text>
  <text x="200" y="65" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" opacity="0.8">Not Your Average Side</text>
</svg> 