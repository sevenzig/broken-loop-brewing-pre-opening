services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blb
      POSTGRES_PASSWORD: blb_local_dev
      POSTGRES_DB: broken_loop_brewing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blb -d broken_loop_brewing"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://blb:blb_local_dev@db:5432/broken_loop_brewing
      PORT: "3000"
      SERVE_STATIC: "true"
      STATIC_DIR: /app/dist
      JWT_SECRET: docker-local-dev-secret-change-in-production
      NODE_ENV: production

volumes:
  pgdata:
